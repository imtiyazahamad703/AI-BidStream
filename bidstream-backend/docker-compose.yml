version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bidstream_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bidstream_dev
    ports:
      - "3306:3306"
    networks:
      - bidstream-network

  redis:
    image: redis:7.0
    container_name: bidstream_redis
    ports:
      - "6379:6379"
    networks:
      - bidstream-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: bidstream_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bidstream-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: bidstream_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bidstream-network

networks:
  bidstream-network:
    driver: bridge
